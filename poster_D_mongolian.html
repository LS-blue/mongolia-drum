<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>몽골 선교지 드럼 후원 - 몽골 테마 디자인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #dfe8ec;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .poster {
    width: 100%;
    max-width: 640px;
    background: linear-gradient(180deg, #2f6ea3 0%, #6fa8cf 55%, #cfe6ef 100%);
    box-shadow: 0 20px 50px rgba(20,50,70,0.25);
    position: relative;
    overflow: hidden;
    padding-bottom: 40px;
  }
  @media (max-width: 520px) {
    body { padding: 0; }
    .poster { box-shadow: none; }
    .content { padding: 32px 24px 0; }
    .scene { margin: 0 -24px 30px; }
    .card, .details, .cta { margin-left: 24px; margin-right: 24px; }
    h1 { font-size: 30px; }
  }
  .pattern-border {
    height: 16px;
    width: 100%;
    background: repeating-linear-gradient(45deg, #c8102e 0 10px, #f4c542 10px 20px);
  }
  .content { padding: 40px 44px 0; position: relative; z-index: 2; }
  .tag {
    display: inline-block;
    background: #f4c542;
    color: #1a3a52;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 22px;
  }
  h1 {
    font-size: 38px;
    font-weight: 900;
    line-height: 1.4;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    margin-bottom: 18px;
  }
  h1 span { color: #f4c542; }
  .sub {
    font-size: 15px;
    color: #eaf3f8;
    line-height: 1.75;
    max-width: 500px;
    margin-bottom: 30px;
  }
  .scene {
    position: relative;
    height: 190px;
    margin: 0 -44px 30px;
    overflow: hidden;
  }
  .card {
    background: rgba(255,255,255,0.92);
    border-radius: 16px;
    margin: 0 44px 22px;
    padding: 22px 24px;
  }
  .goal-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .goal-row .amount { font-size: 30px; font-weight: 900; color: #1a3a52; }
  .goal-row .target { font-size: 14px; color: #6a7f8c; }
  .bar-track {
    width: 100%;
    height: 14px;
    background: #e3ecef;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .bar-fill {
    width: 22%;
    height: 100%;
    background: linear-gradient(90deg, #c8102e, #f4c542);
  }
  .bar-note { font-size: 12px; color: #8a9aa5; }
  .details {
    margin: 0 44px 26px;
    background: rgba(255,255,255,0.85);
    border-radius: 16px;
    padding: 18px 22px;
    font-size: 14px;
    color: #1a3a52;
    line-height: 2;
  }
  .details b { color: #c8102e; }
  .cta {
    display: block;
    margin: 0 44px;
    text-align: center;
    background: #c8102e;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    padding: 18px;
    border-radius: 999px;
  }
</style>
</head>
<body>
<div class="poster">
  <div class="pattern-border"></div>
  <div class="content">
    <span class="tag">온누리교회 SNS 공동체</span>
    <h1>드넓은 초원에<br><span>찬양의 리듬</span>을 더해주세요</h1>
    <p class="sub">애쯔니교회의 예배가 더욱 풍성하게 울리고 퍼지도록, 고장난 드럼을 새로운 드럼 소리로 바꾸는 데에 힘을 보태주세요!</p>

    <div class="scene">
      <svg width="100%" height="230" viewBox="0 0 640 230" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 175 Q160 150 320 170 Q480 190 640 160 L640 230 L0 230 Z" fill="#dff0d8" opacity="0.9"/>
        <circle cx="560" cy="45" r="30" fill="#f4c542" opacity="0.9"/>
        <path d="M90 172 L135 130 L180 172 Z" fill="#f7f2e6" stroke="#8a5a2a" stroke-width="2.5"/>
        <rect x="128" y="150" width="14" height="22" fill="#8a5a2a"/>
        <circle cx="135" cy="140" r="3" fill="#c8102e"/>
        <ellipse cx="135" cy="176" rx="46" ry="8" fill="#c9d9a8" opacity="0.7"/>

        <ellipse cx="500" cy="188" rx="88" ry="16" fill="#1a3a52" opacity="0.12"/>

        <line x1="440" y1="55" x2="500" y2="105" stroke="#8a5a2a" stroke-width="9" stroke-linecap="round"/>
        <circle cx="440" cy="55" r="8" fill="#5a3d26"/>
        <line x1="560" y1="55" x2="500" y2="105" stroke="#8a5a2a" stroke-width="9" stroke-linecap="round"/>
        <circle cx="560" cy="55" r="8" fill="#5a3d26"/>

        <path d="M415 118 L415 175 Q415 200 500 200 Q585 200 585 175 L585 118 Z" fill="#c8102e" stroke="#7a0c1f" stroke-width="3.5"/>
        <path d="M425 160 Q500 176 575 160 L575 178 Q500 194 425 178 Z" fill="#f4c542"/>
        <rect x="424" y="122" width="13" height="34" rx="3" fill="#7a0c1f"/>
        <rect x="461" y="122" width="13" height="34" rx="3" fill="#7a0c1f"/>
        <rect x="498" y="122" width="13" height="34" rx="3" fill="#7a0c1f"/>
        <rect x="535" y="122" width="13" height="34" rx="3" fill="#7a0c1f"/>
        <rect x="572" y="122" width="13" height="34" rx="3" fill="#7a0c1f"/>
        <ellipse cx="500" cy="118" rx="85" ry="26" fill="#f4c542" stroke="#7a0c1f" stroke-width="3.5"/>
        <ellipse cx="500" cy="113" rx="85" ry="26" fill="#fdf6e6" stroke="#7a0c1f" stroke-width="3.5"/>
        <path d="M420 108 Q500 132 580 108" fill="none" stroke="#c8102e" stroke-width="2" opacity="0.5"/>
        <circle cx="500" cy="112" r="5" fill="#c8102e" opacity="0.8"/>
      </svg>
    </div>

    <div class="card">
      <div class="goal-row">
        <span class="amount" id="raisedAmount">264,000원 모금</span>
        <span class="target">목표 1,200,000원</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <div class="bar-note" id="barNote">※ 예시 진행률입니다.</div>
      <div style="text-align:right; margin-top:8px;">
        <a href="#" id="adminToggle" style="font-size:12px; color:#8a9aa5; text-decoration:underline;">관리자: 모금액 수정</a>
      </div>
      <div id="pwBox" style="display:none; flex-direction:column; gap:6px; margin-top:10px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="password" id="pwInput" placeholder="관리자 비밀번호" style="flex:1; padding:8px 10px; border:1px solid #cfd8dc; border-radius:8px; font-size:14px; font-family:'Noto Sans KR',sans-serif;">
          <button id="pwSubmit" style="padding:8px 16px; border:none; border-radius:8px; background:#1a3a52; color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif;">확인</button>
        </div>
        <span id="pwError" style="display:none; font-size:12px; color:#c8102e;">비밀번호가 올바르지 않습니다.</span>
      </div>
      <div id="adminBox" style="display:none; align-items:center; gap:8px; margin-top:10px;">
        <input type="number" id="raisedInput" placeholder="모금액 입력 (원)" style="flex:1; padding:8px 10px; border:1px solid #cfd8dc; border-radius:8px; font-size:14px; font-family:'Noto Sans KR',sans-serif;">
        <button id="saveBtn" style="padding:8px 16px; border:none; border-radius:8px; background:#1a3a52; color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif;">저장</button>
      </div>
    </div>

    <div class="details">
      <b>모금 기간</b> : 9월 23일(화) ~ 9월 29일(화)<br>
      <b>후원 계좌</b> : 3333-04-7229828 (유ㅇㄱ)<br>
      <b>선교 담당</b> : 김진현 / 010-7264-6807
    </div>

    <div class="cta">몽골에 드럼을 보내주세요 🇲🇳</div>
  </div>
</div>
<script>
(function () {
  var GOAL = 1200000;
  var STORAGE_KEY = 'mongolDrumRaised';
  var DEFAULT_RAISED = 0;
  var ADMIN_PASSWORD = '1004';

  var raisedEl = document.getElementById('raisedAmount');
  var fillEl = document.getElementById('barFill');
  var noteEl = document.getElementById('barNote');
  var input = document.getElementById('raisedInput');
  var adminBox = document.getElementById('adminBox');
  var toggle = document.getElementById('adminToggle');
  var saveBtn = document.getElementById('saveBtn');
  var pwBox = document.getElementById('pwBox');
  var pwInput = document.getElementById('pwInput');
  var pwSubmit = document.getElementById('pwSubmit');
  var pwError = document.getElementById('pwError');
  var unlocked = false;

  function getRaised() {
    try {
      var v = localStorage.getItem(STORAGE_KEY);
      return v !== null ? parseInt(v, 10) : DEFAULT_RAISED;
    } catch (e) {
      return DEFAULT_RAISED;
    }
  }

  function render(raised) {
    var pct = Math.max(0, Math.min(100, Math.round((raised / GOAL) * 100)));
    raisedEl.textContent = raised.toLocaleString('ko-KR') + '원 모금';
    fillEl.style.width = pct + '%';
    noteEl.textContent = pct + '% 달성';
  }

  var current = getRaised();
  render(current);
  input.value = current;

  toggle.addEventListener('click', function (e) {
    e.preventDefault();
    if (unlocked) {
      var showing = adminBox.style.display === 'flex';
      adminBox.style.display = showing ? 'none' : 'flex';
      return;
    }
    var showingPw = pwBox.style.display === 'flex';
    pwBox.style.display = showingPw ? 'none' : 'flex';
    if (!showingPw) {
      pwInput.value = '';
      pwError.style.display = 'none';
      pwInput.focus();
    }
  });

  function tryUnlock() {
    if (pwInput.value === ADMIN_PASSWORD) {
      unlocked = true;
      pwBox.style.display = 'none';
      pwError.style.display = 'none';
      adminBox.style.display = 'flex';
    } else {
      pwError.style.display = 'block';
      pwInput.value = '';
      pwInput.focus();
    }
  }

  pwSubmit.addEventListener('click', tryUnlock);
  pwInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryUnlock();
  });

  saveBtn.addEventListener('click', function () {
    var val = parseInt(input.value, 10);
    if (isNaN(val) || val < 0) {
      input.style.borderColor = '#c8102e';
      return;
    }
    input.style.borderColor = '#cfd8dc';
    try {
      localStorage.setItem(STORAGE_KEY, String(val));
    } catch (e) {}
    render(val);
    adminBox.style.display = 'none';
  });

})();
</script>
</body>
</html>
